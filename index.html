<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山本ゆか｜おすすめの宿まとめ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
         background: #fff; color: #111; max-width: 480px; margin: 0 auto; }

  .profile { padding: 40px 24px 28px; border-bottom: 1px solid #f0f0f0; }
  .profile-inner { display: flex; align-items: center; gap: 16px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%;
            background: #e8f0fe; display: flex; align-items: center;
            justify-content: center; font-size: 24px; flex-shrink: 0;
            border: 1px solid #d0ddf7; }
  .profile-text h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .profile-text p { font-size: 13px; color: #666; line-height: 1.5; }

  .section { padding: 24px 24px 0; }
  .section-label { font-size: 11px; color: #999; letter-spacing: 0.08em;
                   text-transform: uppercase; margin-bottom: 16px; }

  .hotel-card { border: 1px solid #e8e8e8; border-radius: 12px;
                overflow: hidden; margin-bottom: 12px; }
  .hotel-img { width: 100%; height: 180px; object-fit: cover;
               background: #f5f5f5; display: block; }
  .hotel-body { padding: 14px 16px; }
  .hotel-tag { font-size: 11px; color: #1a73e8; font-weight: 500;
               margin-bottom: 6px; }
  .hotel-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .hotel-meta { font-size: 12px; color: #888; margin-bottom: 12px; }
  .hotel-meta span + span::before { content: '·'; margin: 0 6px; }
  .btn { display: block; border: 1.5px solid #1a73e8; color: #1a73e8;
         text-align: center; padding: 11px; border-radius: 8px;
         font-size: 13px; font-weight: 500; text-decoration: none; }
  .btn:hover { background: #f0f4ff; }

  .link-section { padding: 12px 24px 0; }
  .link-btn { display: block; border: 1px solid #e0e0e0; color: #555;
              text-align: center; padding: 13px; border-radius: 8px;
              font-size: 13px; text-decoration: none; margin-bottom: 10px; }
  .link-btn:hover { background: #fafafa; }

  .footer { padding: 32px 24px; font-size: 11px; color: #bbb;
            border-top: 1px solid #f0f0f0; margin-top: 24px; }
</style>
</head>
<body>

<div class="profile">
  <div class="profile-inner">
    <div class="avatar">✈️</div>
    <div class="profile-text">
      <h1>山本ゆか</h1>
      <p>楽天ポイントで月1旅行する主婦<br>旅行代理店出身・3児の母</p>
    </div>
  </div>
</div>

<div class="section" style="padding-top:24px;">
  <div class="section-label">おすすめの宿</div>
  <div id="hotel-list"></div>
</div>

<div class="link-section">
  <a class="link-btn" href="https://travel.rakuten.co.jp/" target="_blank">楽天トラベルで宿を探す</a>
</div>

<div class="footer">
  山本ゆか — Threads @pointo_de_tabi_yuka<br>
  ※ページ内のリンクはアフィリエイトリンクを含みます
</div>

<script src="hotel_data.js"></script>
<script>
  if (typeof HOTEL_LIST !== 'undefined' && HOTEL_LIST.length > 0) {
    var container = document.getElementById('hotel-list');
    HOTEL_LIST.forEach(function(h) {
      var card = document.createElement('div');
      card.className = 'hotel-card';
      var img = h.image
        ? '<img class="hotel-img" src="' + h.image + '" alt="' + h.name + '" loading="lazy">'
        : '<div class="hotel-img"></div>';
      card.innerHTML = img +
        '<div class="hotel-body">' +
          '<div class="hotel-tag">' + h.area + '</div>' +
          '<div class="hotel-name">' + h.name + '</div>' +
          '<div class="hotel-meta">' +
            '<span>★ ' + h.review + '（' + h.review_count + '件）</span>' +
            '<span>' + Number(h.min_charge).toLocaleString() + '円〜</span>' +
          '</div>' +
          '<a class="btn" href="' + h.affiliate_url + '" target="_blank">楽天トラベルで空室を確認</a>' +
        '</div>';
      container.appendChild(card);
    });
  }
</script>
</body>
</html>
